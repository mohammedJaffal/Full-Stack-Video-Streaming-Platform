[package]
name = "streaming-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
redis = { version = "0.27", features = ["tokio-comp"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
