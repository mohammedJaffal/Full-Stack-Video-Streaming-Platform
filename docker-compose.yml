services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-streaming}
      MYSQL_USER: ${MYSQL_USER:-streaming}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-streaming}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://streaming:streaming@mysql:3306/streaming}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-development-secret}
      PLAYBACK_TOKEN_TTL_SECONDS: ${PLAYBACK_TOKEN_TTL_SECONDS:-300}
      MEDIA_RELAY_URL: ${MEDIA_RELAY_URL:-http://localhost:8787}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-development-media-secret}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./apps/worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://streaming:streaming@mysql:3306/streaming}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
